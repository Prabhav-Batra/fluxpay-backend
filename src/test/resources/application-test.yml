server:
  servlet:
    session:
      cookie:
        secure: false

fluxpay:
  frontend-base-url: http://localhost:3000
  rate-limit:
    rules:
      - name: auth
        method: POST
        paths: [/api/v1/auth/login, /api/v1/auth/signup]
        capacity: 10000
        period: 1m
  razorpay:
    base-url: https://razorpay.invalid
    connect-timeout: 1s
    read-timeout: 1s
    test:
      key-id: rzp_test_fake
      key-secret: fake_secret
      webhook-secret: whsec_fake_test
  jobs:
    enabled: false
  webhooks:
    allow-loopback: true
