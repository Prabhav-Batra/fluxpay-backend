spring:
  application:
    name: fluxpay-backend
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

server:
  # native = Tomcat RemoteIpValve: X-Forwarded-For is honoured only when the direct peer is an internal proxy,
  # and the client IP is the rightmost untrusted hop. "framework" would trust any client-supplied header.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db

fluxpay:
  frontend-base-url: ${FRONTEND_BASE_URL}
  admin:
    bootstrap-email: ${FLUXPAY_ADMIN_EMAIL:}
    bootstrap-password: ${FLUXPAY_ADMIN_PASSWORD:}
  merchants:
    default-platform-fee-bps: ${DEFAULT_PLATFORM_FEE_BPS:500}
  rate-limit:
    rules:
      - name: auth
        method: POST
        paths: [/api/v1/auth/login, /api/v1/auth/signup]
        capacity: 10
        period: 1m
      - name: public-write
        method: POST
        paths: [/api/v1/public/**]
        capacity: 30
        period: 1m
      - name: public-read
        method: GET
        paths: [/api/v1/public/**]
        capacity: 300
        period: 1m
  razorpay:
    base-url: https://api.razorpay.com
    connect-timeout: 5s
    read-timeout: 10s
    test:
      key-id: ${RAZORPAY_TEST_KEY_ID}
      key-secret: ${RAZORPAY_TEST_KEY_SECRET}
      webhook-secret: ${RAZORPAY_TEST_WEBHOOK_SECRET}
    live:
      key-id: ${RAZORPAY_LIVE_KEY_ID:}
      key-secret: ${RAZORPAY_LIVE_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_LIVE_WEBHOOK_SECRET:}
  checkout:
    session-ttl: 30m
  jobs:
    enabled: ${FLUXPAY_JOBS_ENABLED:true}
    expiry-interval: 1m
    reconciliation-interval: 5m
    reconciliation-min-age: 10m
    reconciliation-grace-after-expiry: 1h
    idempotency-retention: 24h
    webhook-interval: 10s
  webhooks:
    connect-timeout: 5s
    read-timeout: 10s
    lease: 2m
    batch-size: 50
