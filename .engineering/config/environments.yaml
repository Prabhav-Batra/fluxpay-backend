# ProjectOS Configuration: environments.yaml
#
# SCHEMA VERSION: 1.0.0
# PURPOSE: Defines deployment targets and environment-specific constraints.
# BEHAVIORAL IMPACT:
# - AI uses these URLs for CORS, API configuration, and mock generation.
# - AI understands which environments are locked (e.g., prod requires review).

api_version: v1
kind: EnvironmentConfig
spec:
  environments:
    - name: "local"
      url: "http://localhost:3000"
      auto_deploy: false
      
    - name: "staging"
      url: "https://staging.<template-domain>.com"
      auto_deploy: true
      branch_target: "main"
      
    - name: "production"
      url: "https://<template-domain>.com"
      auto_deploy: false
      branch_target: "release/*"
      approval_required: true
