terms:
  "Merchant": "A business that sells products through FluxPay (e.g. Jextter). The tenant."
  "Platform admin": "FluxPay operator who manages merchants, fees and payouts."
  "Mode": "test or live. Every merchant-owned record belongs to exactly one mode."
  "Product": "A one-time item a merchant sells at a fixed price (e.g. 'Pro Pack ₹49'). FluxPay does not know what credits it grants."
  "Customer ref": "The merchant's own identifier for its end user, passed into a checkout session and returned in webhooks."
  "Checkout session": "A single attempt by one customer to buy one product; holds the price snapshot and expires after 30 minutes."
  "Payment link": "A shareable URL for a product that creates a checkout session when opened."
  "Payment": "The gateway's record of money captured for a checkout session."
  "Sale": "FluxPay's record that a customer ref bought a product. Created exactly once per captured payment."
  "Ledger entry": "An append-only signed money movement for a merchant (sale_gross, platform_fee, gateway_fee, refund, payout)."
  "Balance": "Sum of a merchant's ledger entries: what FluxPay owes the merchant."
  "Payout": "Money sent from the platform to a merchant, recorded by the platform admin."
  "Platform fee": "FluxPay's cut of each sale, configured per merchant in basis points."
  "Event": "Something that happened that merchants are notified about (checkout.completed, checkout.expired, sale.refunded)."
  "Webhook endpoint": "A merchant URL plus signing secret that receives events."
  "Delivery": "One event sent to one endpoint, with its attempts and retry schedule."
