- id: TD-001
  date: "2026-10-02"
  description: "Payouts are recorded manually by the platform admin."
  impact: "Medium - manual work and settlement risk; collecting for third parties at scale needs Razorpay Route or a PA licence."
  location: "ledger, admin modules"
  status: "open"
- id: TD-002
  date: "2026-10-02"
  description: "Refunds can only be initiated in the Razorpay dashboard; the platform fee is not reversed on refund."
  impact: "Low - merchants cannot self-serve refunds."
  location: "sales module"
  status: "open"
- id: TD-003
  date: "2026-10-02"
  description: "Rate limiting is in-process (Bucket4j)."
  impact: "Medium - limits are per instance once more than one backend instance runs."
  location: "common/web rate limiting"
  status: "open"
- id: TD-004
  date: "2026-10-02"
  description: "Plan 1 review minors: concurrent API-key rolls can leave two active keys; ApiKeyRepository exposes unscoped JpaRepository methods; invalid FluxPay-Mode header ignored for API keys; case-sensitive Bearer scheme; unexpected filter exceptions bypass error envelope."
  impact: "Low - edge cases in API key handling; no cross-tenant exposure."
  location: "src/main/java/com/fluxpay/apikeys"
  status: "open"
- id: TD-005
  date: "2026-10-02"
  description: "Plan 1 review minors: CSRF token not rotated on login; logout without session returns 401; CORS exposes no custom headers and breaks on trailing slash in FRONTEND_BASE_URL; BAD_REQUEST echoes exception text; X-RateLimit-Reset is 0 when allowed; trace_id vs traceId naming needs an ADR; no test for rolled-key authentication."
  impact: "Low - polish and hardening."
  location: "src/main/java/com/fluxpay/config, common/error, common/ratelimit"
  status: "open"
- id: TD-006
  date: "2026-10-02"
  description: "Verify on Render that the proxy connects from a private range so Tomcat RemoteIpValve resolves the real client IP; otherwise set server.tomcat.remoteip.internal-proxies."
  impact: "Medium - if wrong, all clients share one rate-limit bucket (fails closed, not open)."
  location: "src/main/resources/application.yml"
  status: "open"
- id: TD-007
  date: "2026-10-02"
  description: "Razorpay calls use timeouts but no circuit breaker (ProjectOS backend standard #13)."
  impact: "Low - a Razorpay outage makes each pay click wait up to the read timeout."
  location: "src/main/java/com/fluxpay/payments/service/RazorpayGateway.java"
  status: "open"
- id: TD-008
  date: "2026-10-02"
  description: "Payments flagged AMOUNT_MISMATCH or DUPLICATE are only logged; there is no admin view or automatic refund."
  impact: "Medium - customer money held without a sale until someone refunds it in Razorpay."
  location: "src/main/java/com/fluxpay/sales/service/SaleCaptureServiceImpl.java"
  status: "open"
- id: TD-009
  date: "2026-10-02"
  description: "Plan 2 review minors: idempotency key can stick in-progress after a crash; public view reports expired while a payment is in flight (frontend must keep polling); concurrent-capture test doesn't assert statuses; missing cross-tenant tests for payment links, ledger entries and dashboard sales list; Razorpay 401/400 reported as GATEWAY_UNAVAILABLE; expiry job capped at 100/min."
  impact: "Low - edge cases, observability and test coverage."
  location: "common/idempotency, checkout, payments, sales, tests"
  status: "open"
- id: TD-010
  date: "2026-10-02"
  description: "Real Razorpay order creation and order-payments lookup not yet verified end to end: the legacy test keys return 401. Re-run the Plan 2 Task 13 smoke test with current test keys."
  impact: "High until verified - live checkout depends on it."
  location: "src/main/java/com/fluxpay/payments/service/RazorpayGateway.java"
  status: "open"
- id: TD-011
  date: "2026-10-02"
  description: "Plan 3 review minors: one merchant's slow endpoint can delay a dispatch batch (no per-endpoint concurrency cap; resend/test unthrottled); non-RestClient exceptions during send are not counted as attempts; endpoint-limit check races; timeseries/top-products count refunded sales as gross; invalid admin payouts ?mode silently means live; Razorpay refunds can push a balance below zero after a payout; webhook endpoint ports unrestricted."
  impact: "Low - fairness, edge cases and labelling."
  location: "events, analytics, admin"
  status: "open"
