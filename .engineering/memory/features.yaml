# Completed Features Registry
# High-level index of built capabilities. Updated as each feature PR merges.

features:
  - name: "Backend foundation"
    description: "Spring Boot skeleton, /health/live and /health/ready, Flyway, error envelope, correlation ids, UUIDv7 prefixed public ids."
    modules: ["src/main/java/com/fluxpay/common"]
  - name: "Merchant signup and dashboard sessions"
    description: "Self-serve signup creates a merchant and owner; session login/logout/me with CSRF; platform admin bootstrap from env."
    modules: ["src/main/java/com/fluxpay/identity", "src/main/java/com/fluxpay/merchants"]
  - name: "Merchant profile"
    description: "Business name, logo URL and brand colour editable from the dashboard."
    modules: ["src/main/java/com/fluxpay/merchants"]
  - name: "API keys"
    description: "Hashed sk_test_/sk_live_ keys with create, list, roll, revoke; Bearer authentication; GET /api/v1/account."
    modules: ["src/main/java/com/fluxpay/apikeys"]
  - name: "Auth rate limiting"
    description: "Configurable per-IP limits with X-RateLimit headers; 429 RATE_LIMITED."
    modules: ["src/main/java/com/fluxpay/common/ratelimit"]
  - name: "Products and payment links"
    description: "One-time products (dashboard CRUD, API read) and shareable /l/<slug> payment links with safe redirects."
    modules: ["src/main/java/com/fluxpay/catalog"]
  - name: "Checkout sessions and hosted checkout API"
    description: "Idempotent POST /api/v1/checkout_sessions, price snapshot, 30-minute expiry, public view/pay endpoints, payment-link sessions."
    modules: ["src/main/java/com/fluxpay/checkout", "src/main/java/com/fluxpay/common/idempotency"]
  - name: "Razorpay payments"
    description: "Per-mode Razorpay orders, signed webhook intake, payment records, reconciliation of missed webhooks."
    modules: ["src/main/java/com/fluxpay/payments", "src/main/java/com/fluxpay/sales/service"]
  - name: "Sales, refunds and ledger"
    description: "Exactly-once sale per captured payment, refunds from Razorpay, append-only ledger with platform and gateway fees, balance."
    modules: ["src/main/java/com/fluxpay/sales", "src/main/java/com/fluxpay/ledger"]
  - name: "Event outbox"
    description: "checkout.completed, checkout.expired and sale.refunded written transactionally to events (delivery in Plan 3)."
    modules: ["src/main/java/com/fluxpay/events"]
  - name: "Merchant webhooks"
    description: "Endpoint management (SSRF-guarded URLs, secrets, roll, test ping), event log with deliveries and resend, signed dispatcher with leased claims and 8-attempt backoff."
    modules: ["src/main/java/com/fluxpay/events"]
  - name: "Analytics"
    description: "Summary (gross, refunds, fees, net, count), IST daily timeseries with zero-filled days, top products."
    modules: ["src/main/java/com/fluxpay/analytics"]
  - name: "Platform admin and payouts"
    description: "Merchant list/detail with test and live balances, fee and suspension changes, manual payouts guarded by available balance."
    modules: ["src/main/java/com/fluxpay/admin", "src/main/java/com/fluxpay/ledger"]
